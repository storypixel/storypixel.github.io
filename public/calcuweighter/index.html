<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calcuweight</title>
  <link rel="canonical" href="https://iamnotsam.com/versions/v2/calcuweighter/">
  <meta http-equiv="refresh" content="0; url=/versions/v2/calcuweighter/">
  <!--
    Why this file exists:
    Calcuweight's App Store record registers both its Support URL and its
    Marketing URL as /calcuweighter, but the app page actually lives at
    /versions/v2/calcuweighter/ (and its support page at
    /versions/v2/calcuweighter/support.html). So both links resolved to the
    SPA 404 shell.

    Redirect rather than a copy, so the app page stays a single source of
    truth. Point the App Store record at the /versions/v2/ paths on the next
    app version and this file can go.
  -->
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           line-height: 1.6; color: #333; background: #fafafa; padding: 2rem; }
    main { max-width: 40rem; margin: 0 auto; }
  </style>
</head>
<body>
  <main>
    <h1>Calcuweight</h1>
    <p>Redirecting to the Calcuweight app page.</p>
    <p><a href="/versions/v2/calcuweighter/">Continue to Calcuweight</a>
       &middot; <a href="/versions/v2/calcuweighter/support.html">Support</a></p>
  </main>
</body>
</html>
