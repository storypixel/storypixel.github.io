<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Callbook — Describe a Play</title>
<meta name="description" content="Copy one prompt into any AI, describe your dodgeball play in plain English, and paste back the notation — it animates instantly.">
<style>
  * { box-sizing:border-box; }
  body { margin:0; background:#fff; color:#111; font:16px/1.6 Georgia,"Times New Roman",serif; }
  .wrap { max-width:720px; margin:0 auto; padding:28px 16px 80px; }
  h1 { font-size:1.9rem; font-weight:normal; margin:0 0 10px; }
  p { margin:0 0 12px; }
  .small { font-size:.85rem; color:#555; }
  textarea {
    width:100%; padding:10px; border:1px solid #999; background:#fffdf8;
    font:14px/1.5 "Courier New",Courier,monospace; color:#111;
  }
  textarea:focus { outline:2px solid #18324b; }
  button {
    font:inherit; font-size:1rem; padding:10px 18px; margin:4px 8px 4px 0;
    border:1px solid #111; background:#fff; color:#111; cursor:pointer; border-radius:0;
  }
  button:hover { background:#f0ede6; }
  button:disabled { color:#999; border-color:#999; cursor:default; background:#fff; }
  .status { font-size:.85rem; margin:6px 0 0; min-height:1.3em; }
  .status.ok { color:#28745a; }
  .status.err { color:#b9342b; }
  .status.busy { color:#555; font-style:italic; }
  #stage { margin:14px 0 0; }
  #share { margin-top:10px; }
  #share button { font-size:.85rem; padding:6px 12px; }
  a { color:#18324b; }
  hr { border:0; border-top:1px solid #ccc; margin:26px 0; }
  footer { margin-top:34px; font-size:.85rem; color:#555; }
  @media(max-width:480px){ .wrap { padding-left:12px; padding-right:12px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Describe a play</h1>
  <p>Copy the prompt, paste it into any AI — ChatGPT, Claude, Gemini. It will ask for your play; describe it like a coach would. Paste what it gives you below and watch it run.</p>

  <button id="copy-prompt">Copy the prompt</button>
  <p class="status" id="prompt-status"></p>
  <textarea id="prompt-out" rows="8" spellcheck="false" readonly hidden aria-label="The prompt, ready to copy"></textarea>

  <hr>

  <textarea id="dbn" rows="8" spellcheck="false" placeholder="Paste the notation your AI gives back…"></textarea>
  <p class="status" id="dbn-status"></p>
  <div id="stage"></div>
  <div id="share" hidden>
    <button id="copy-embed">Copy embed code</button>
    <button id="copy-dbn">Copy notation</button>
    <a id="editor-link" href="index.html">Open in the editor →</a>
    <p class="status" id="share-status"></p>
  </div>

  <footer>
    The rules: <a href="NOTATION.md">notation</a> ·
    <a href="https://iamnotsam.com/callbook/agent.md">for AI agents</a> ·
    <a href="GLOSSARY.md">glossary</a> ·
    <a href="index.html">the playbook</a> ·
    <a href="https://iamnotsam.com/callbook/">Callbook</a>
  </footer>
</div>

<script src="vendor/play-animator.js"></script>
<script src="vendor/dbn.js"></script>
<script>
(function () {
  "use strict";

  var ENGINE_BASE = "https://iamnotsam.com/dodgeball-play-notation/";
  var els = {};
  ["copy-prompt","prompt-status","prompt-out","dbn","dbn-status","stage",
   "share","copy-embed","copy-dbn","editor-link","share-status"].forEach(function (id) {
    els[id.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); })] = document.getElementById(id);
  });

  // The spec IS the prompt: NOTATION.md is fetched live so the converter can
  // never drift from the notation it targets (no-magic rule — one source of
  // truth). A few worked examples anchor the style.
  var EXAMPLES = ["home.dbn", "insides.dbn", "pitch-back.dbn"];
  function fetchText(url) {
    return fetch(url, { cache: "no-cache" }).then(function (r) {
      if (!r.ok) throw new Error("fetch " + url + " -> " + r.status);
      return r.text();
    });
  }
  var specReady = Promise.all(
    [fetchText("NOTATION.md")].concat(EXAMPLES.map(function (f) { return fetchText("examples/" + f); }))
  );

  function buildPrompt(parts) {
    return [
      "You convert plain-English dodgeball play descriptions into DBN (Dodgeball Notation).",
      "",
      "The full spec is included below so this works even without web access.",
      "Canonical sources, if you can fetch: " + ENGINE_BASE + "NOTATION.md",
      "and https://iamnotsam.com/callbook/agent.md (agent step-by-step, incl. a free validate endpoint).",
      "",
      "Rules:",
      "- Reply with ONLY the DBN play text. No code fences, no commentary, no explanation.",
      "- Start with [Play \"...\"], add [Balls \"...\"] when anyone starts loaded, then numbered beats.",
      "- Prefer named formations (huddle, line, mid, deep, back) over coordinates; use exact depths or (x,y) only when the description demands it.",
      "- Every beat gets a short {label} written the way a coach talks.",
      "- Keep it minimal: only the players the description mentions act; everyone else stays put.",
      "- If the description is ambiguous, pick the most conventional reading and encode it — do not ask questions about it.",
      "",
      "The full DBN specification:",
      "",
      parts[0],
      "",
      "Example plays in DBN:",
      "",
      parts.slice(1).join("\n\n---\n\n"),
      "",
      "---",
      "",
      "The user will describe their play in their next message. Reply now with " +
      "exactly: \"Ready — describe your play.\" Then convert their description " +
      "to DBN, replying with only the notation.",
    ].join("\n");
  }

  function setStatus(el, cls, msg) {
    el.className = "status" + (cls ? " " + cls : "");
    el.textContent = msg || "";
  }

  function copyTextFallback(text) {
    return new Promise(function (resolve, reject) {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
      if (ok) resolve(); else reject(new Error("copy blocked"));
    });
  }
  function copyText(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      // the async API can reject (focus, permissions) — fall back, don't fail
      return navigator.clipboard.writeText(text).catch(function () {
        return copyTextFallback(text);
      });
    }
    return copyTextFallback(text);
  }

  els.copyPrompt.addEventListener("click", function () {
    setStatus(els.promptStatus, "busy", "Building prompt…");
    specReady.then(function (parts) {
      var prompt = buildPrompt(parts);
      return copyText(prompt).then(function () {
        els.promptOut.hidden = true;
        setStatus(els.promptStatus, "ok", "✓ Copied. Paste it into your AI — it will ask for your play.");
      }, function () {
        // Clipboard blocked (embedded browsers, strict permissions): show the
        // prompt pre-selected so copying is one keystroke, never a dead end.
        els.promptOut.value = prompt;
        els.promptOut.hidden = false;
        els.promptOut.focus();
        els.promptOut.select();
        setStatus(els.promptStatus, "ok", "It's below, already selected — copy it (Ctrl/Cmd-C or long-press).");
      });
    }).catch(function (e) {
      setStatus(els.promptStatus, "err", "✗ " + (e && e.message || e));
    });
  });

  // ── paste → validate with the real parser → animate → share ─────────────
  var mount = null;
  var embedSnippet = "";
  function renderDbn() {
    var text = els.dbn.value;
    if (!text.trim()) {
      setStatus(els.dbnStatus, "", "");
      els.stage.innerHTML = "";
      els.share.hidden = true;
      return;
    }
    var play;
    try {
      play = window.DBN.parse(text);
    } catch (e) {
      setStatus(els.dbnStatus, "err", "✗ " + ((e && e.message) || e));
      els.share.hidden = true;
      return;
    }
    var beats = (play.steps || []).length;
    setStatus(els.dbnStatus, "ok", "✓ " + (play.name || "play") + " — " + beats + " beat" + (beats === 1 ? "" : "s") + ". Edit freely; it re-runs as you type.");
    try {
      if (mount && mount.destroy) mount.destroy();
      els.stage.innerHTML = "";
      var island = document.createElement("div");
      els.stage.appendChild(island);
      var root = island.attachShadow ? island.attachShadow({ mode: "open" }) : island;
      var host = document.createElement("div");
      root.appendChild(host);
      mount = window.DodgeballPlay.mount(host, play, { chrome: "minimal", prose: false });
    } catch (e) {
      setStatus(els.dbnStatus, "err", "✗ render error: " + ((e && e.message) || e));
      els.share.hidden = true;
      return;
    }
    var escaped = text.replace(/&/g, "&amp;").replace(/'/g, "&#39;");
    embedSnippet =
      "<div data-db-play-dbn='\n" + escaped + "\n'></div>\n" +
      '<script src="' + ENGINE_BASE + 'vendor/play-animator.js"><\/script>\n' +
      '<script src="' + ENGINE_BASE + 'vendor/dbn.js"><\/script>';
    els.editorLink.href = "index.html?dbn=" + encodeURIComponent(text);
    els.share.hidden = false;
  }
  var renderTimer = null;
  els.dbn.addEventListener("input", function () {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderDbn, 250);
  });

  els.copyEmbed.addEventListener("click", function () {
    copyText(embedSnippet).then(function () {
      setStatus(els.shareStatus, "ok", "✓ Embed code copied — paste it into any web page.");
    }, function () {
      setStatus(els.shareStatus, "err", "✗ copy blocked — use Open in the editor instead.");
    });
  });
  els.copyDbn.addEventListener("click", function () {
    copyText(els.dbn.value).then(function () {
      setStatus(els.shareStatus, "ok", "✓ Notation copied.");
    }, function () {
      setStatus(els.shareStatus, "err", "✗ copy blocked — select the text above and copy.");
    });
  });
})();
</script>
</body>
</html>
