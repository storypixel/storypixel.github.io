<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

  <title>Privacy Policy - Calcuweight</title>
  <link rel="canonical" href="https://iamnotsam.com/privacy/calcuweight.html">
  <meta http-equiv="refresh" content="0; url=/privacy/calcuweight.html">
  <!--
    Why this file exists:
    Calcuweight's App Store record registers its Privacy Policy URL as
    /privacy/calcuweighter.html (the SKU spelling, "calcuweighter"), but the
    actual policy has always lived at /privacy/calcuweight.html (the app-name
    spelling). One word apart, so the App Store privacy link resolved to the
    SPA 404 shell instead of the policy.

    This is a redirect rather than a copy so there is exactly one source of
    truth for the policy text. Fix the App Store record to point at
    /privacy/calcuweight.html on the next app version and this file can go.
  -->
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
           line-height: 1.6; color: #333; background: #fafafa; padding: 2rem; }
    main { max-width: 40rem; margin: 0 auto; }
  </style>
</head>
<body>
  <main>
    <h1>Privacy Policy - Calcuweight</h1>
    <p>Redirecting to the Calcuweight privacy policy.</p>
    <p><a href="/privacy/calcuweight.html">Continue to the privacy policy</a></p>
  </main>
</body>
</html>
